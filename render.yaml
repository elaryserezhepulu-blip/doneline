# Free setup: Render free web service + Neon free Postgres + Brevo free email API.
# Keep it awake & run reminders with a free cron-job.org ping to /cron every 5 minutes.
services:
  - type: web
    name: doneline
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /cron
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: SITE_NAME
        value: Doneline
      - key: DATABASE_URL      # Neon connection string (paste in Render dashboard)
        sync: false
      - key: BREVO_API_KEY     # Brevo → SMTP & API → API keys
        sync: false
      - key: MAIL_FROM_EMAIL   # your Gmail, verified as a sender in Brevo
        sync: false
